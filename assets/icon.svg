<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <mask id="cuteyes">
    <rect width="100" height="100" fill="black"/>
    <!-- white = visible icon -->
    <g fill="white" stroke="white" stroke-linecap="round">
      <!-- antennas -->
      <line x1="40" y1="34" x2="34" y2="17" stroke-width="4"/>
      <line x1="60" y1="34" x2="66" y2="17" stroke-width="4"/>
      <circle cx="34" cy="15" r="4.5"/>
      <circle cx="66" cy="15" r="4.5"/>
      <!-- head -->
      <rect x="27" y="33" width="46" height="42" rx="15" stroke="none"/>
    </g>
    <!-- black = cut out (eyes show the background through) -->
    <circle cx="41" cy="55" r="6.5" fill="black"/>
    <circle cx="59" cy="55" r="6.5" fill="black"/>
  </mask>
  <rect width="100" height="100" fill="#ffffff" mask="url(#cuteyes)"/>
</svg>
